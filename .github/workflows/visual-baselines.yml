# Creates or refreshes the Linux visual baselines and commits them to the branch it runs on.
# Run it by hand (Actions tab, "Visual baselines", Run workflow) after an intended design change.
# CI and the build sandbox run on Linux, so they compare against these, not the Mac baselines.
name: Visual baselines
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual:update
      - name: Commit baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/__screenshots__/linux
          git diff --cached --quiet || git commit -m "Update Linux visual baselines"
          git push
